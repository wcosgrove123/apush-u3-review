ion of 1800","q":"How did a treaty with Britain help end Federalist rule?","links":[{"e":"The Senate approves Jay’s Treaty, keeping the peace with Britain.","y":"June 1795","so":"France reads the treaty as an American tilt toward its enemy and begins seizing American ships."},{"e":"French agents demand a bribe from American envoys in the XYZ Affair.","y":"Fall 1797","so":"When the demand becomes public in the spring of 1798, Americans are outraged and Congress prepares for war."},{"e":"Congress builds up the navy, and American ships begin fighting France at sea: the Quasi-War.","y":"Spring 1798","so":"With war fever high, Federalists move against the immigrants and editors who support the opposition."},{"e":"Congress passes the Alien and Sedition Acts.","y":"June and July 1798","so":"Jefferson and Madison answer that the states can judge a federal law unconstitutional."},{"e":"Kentucky and Virginia adopt their Resolutions against the acts.","y":"Late 1798","so":"Anger at the acts and at the war taxes becomes the Democratic-Republican case in the next election."},{"e":"Jefferson defeats Adams in the election of 1800.","y":"1800","so":""}]},{"id":"marbury","title":"From the election of 1800 to judicial review","q":"How did a lost election give the Supreme Court its greatest power?","links":[{"e":"Federalists lose the presidency and Congress in the election of 1800.","y":"Late 1800","so":"They still control the government until March 1801 and decide to entrench themselves in the courts."},{"e":"In their last weeks, Federalists create new judgeships and other court posts, and Adams fills them.","y":"February to March 1801","so":"A few commissions, including William Marbury’s as a justice of the peace, are not delivered before Jefferson takes office."},{"e":"Jefferson orders the undelivered commissions held back, and his secretary of state, James Madison, does not deliver Marbury’s.","y":"Spring 1801","so":"Marbury turns to the courts to force Madison’s hand."},{"e":"Marbury sues in the Supreme Court, using a 1789 law that lets him start his case there.","y":"December 1801","so":"Chief Justice Marshall must decide whether the Court can give orders to the president’s administration, and whether that 1789 law is valid."},{"e":"Marshall rules that Marbury deserves his commission but that the 1789 law is unconstitutional. The Court has claimed the power of judicial review.","y":"February 1803","so":""}]},{"id":"louisiana","title":"From Napoleon’s empire to Lewis and Clark","q":"How did a slave revolt in the Caribbean double the size of the United States?","links":[{"e":"Napoleon takes Louisiana back from Spain, planning a new French empire in America.","y":"1800","so":"A strong France on the Mississippi worries Americans far more than weak Spain did, because western farmers ship everything through New Orleans."},{"e":"Spanish officials, still running the colony, end the American right to store goods at New Orleans.","y":"October 1802","so":"The West is alarmed, and Jefferson decides he must try to buy the city."},{"e":"Jefferson sends James Monroe to Paris to help buy New Orleans.","y":"January 1803","so":"By the time Monroe reaches Paris, Napoleon has given up on his American empire. Haitian resistance and yellow fever have destroyed the army he sent to retake Saint-Domingue, and war with Britain is coming."},{"e":"Napoleon offers all of Louisiana, and the American envoys agree to buy it for $15 million.","y":"April 1803","so":"The Constitution does not mention buying land, so Jefferson has to set aside his strict reading to accept."},{"e":"The Senate ratifies the Louisiana Purchase.","y":"October 1803","so":"The expedition to the Pacific that Jefferson had already planned will now cross land the United States owns."},{"e":"Lewis and Clark set out up the Missouri River.","y":"May 1804","so":""}]},{"id":"war","title":"From impressment to the War of 1812","q":"Why did a country that wanted only to trade end up at war?","links":[{"e":"Br oyal and are mocked across the country.","y":"February 1815","so":"The party never recovers as a national force."},{"e":"James Monroe wins the presidency against the last Federalist candidate.","y":"1816","so":""}]},{"id":"panic","title":"From the War of 1812 to the Panic of 1819","q":"How did the war lead to a bank, a boom, and a crash?","links":[{"e":"The War of 1812 exposes weaknesses: no national bank, poor roads, and dependence on British goods.","y":"1812 to 1815","so":"After the war, even Democratic-Republicans who once opposed Hamilton want national solutions."},{"e":"Congress charters the Second Bank of the United States and passes the protective Tariff of 1816.","y":"April 1816","so":"The new Bank and the state banks lend freely."},{"e":"Easy credit feeds a rush to buy western land.","y":"1817 to 1818","so":"The boom depends on high prices for cotton and grain in Europe."},{"e":"European demand falls, crop prices drop, and the Second Bank calls in its loans.","y":"Late 1818","so":"State banks cannot pay, and they fail."},{"e":"The Panic of 1819: banks close, farms are foreclosed, and workers lose their jobs.","y":"1819","so":"People who lost land and savings look for someone to blame."},{"e":"Westerners turn against the Second Bank.","y":"1820s","so":""}]},{"id":"missouri","title":"From the cotton gin to the Missouri Compromise","q":"How did a machine for cleaning cotton lead to a line across the map?","links":[{"e":"Eli Whitney invents the cotton gin.","y":"1793","so":"Cotton becomes hugely profitable, and so does the labor of enslaved people."},{"e":"Cotton planting and slavery begin spreading west from Georgia and South Carolina.","y":"Late 1790s","so":"Slaveholders now have a strong reason to carry slavery into any new land the country gains."},{"e":"The Louisiana Purchase adds a vast territory west of the Mississippi.","y":"1803","so":"Settlers, some of them slaveholders, move into the Missouri country until it has enough people to ask for statehood." (function () {

  function cur() { return CH[S.c]; }

  function load(i) {

      if (i < S.at - 1) h += '<li class="so"><span class="arrow">SO</span><p>' + esc(L[i].so) + '</p></li>';
      else if (!done) h += '<li class="so wait"><span class="arrow">SO</span><p>' + (S.hint ? '<span style="font-style:normal;color:var(--fg)">' + esc(L[i].so) + '</span>' : 'What did this lead to?') + '</p></li>';

    } else {

      S.solved[c.id] = true; ls('cr.solved', Object.keys(S.solved).join(','));
      box.innerHTML = '<div class="done"><div class="big">Chain complete. ' + clean + ' of ' + (n - 1) + ' links on the first try.</div>' +
        '<p style="margin:8px 0 0;max-width:60ch">Now answer the question at the top in one sentence, out loud or on paper. Use the word <b>because</b> at least once.</p>' +
        '<div class="acts"><button class="btn primary" id="nextc">Next chain</button><button class="btn" id="redo">Build this one again</button></div></div>';
    }
    var s = Object.keys(S.solved).length; $('tally').textContent = s ? s + ' of ' + CH.length + ' chains built' : '';
  }
  function recordDone() {
    if (!PR) return;
    var c = cur(), n = c.links.length, clean = 0, hints = 0;
    for (var j = 1; j < n; j++) { if (!S.missed[j] && !S.hinted[j]) clean++; if (S.hinted[j]) hints++; }
    PR.update(function (p) { var r = p.cr.chains[c.id] || (p.cr.chains[c.id] = { plays: 0, best: -1 }); r.plays++; r.last = clean; r.total = n - 1; if (clean > r.best) r.best = clean; r.at = new Date().toISOString(); });
    PR.event('cr', 'chain_complete', { score: clean, total: n - 1, detail: { chain: c.id, hints: hints } });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
    if (b.dataset.k !== undefined) {
      var k = parseInt(b.dataset.k, 10);
      if (k === S.at) { S.at++; S.tried = {}; S.hint = false; S.say = ''; if (S.at >= cur().links.length) recordDone(); }
      else { S.tried[k] = true; S.missed[S.at] = true; S.say = 'That comes later in the chain. Ask what the last link made possible first.'; }
      render();
      if (S.at >= cur().links.length) { try { $('pickbox').scrollIntoView({ block: 'nearest' }); } catch (e2) {} }
      return;
    }
    if (b.id === 'hint') { S.hint = true; S.hinted[S.at] = true; render(); return; }
    if (b.id === 'rand') { var n = S.c; while (CH.length > 1 && n === S.c) n = Math.floor(Math.random() * CH.length); load(n); return; }
    if (b.id === 'nextc') { load(S.c + 1); try { window.scrollTo(0, Math.max(0, $('q').getBoundingClientRect().top + window.pageYOffset - 20)); } catch (e3) {} return; }
    if (b.id === 'redo') { load(S.c); return; }
  });
  $('pick').addEventListener('change', function () { load(parseInt(this.value, 10) || 0); });
  $('pick').innerHTML = CH.map(function (c, i) { return '<option value="' + i + '">' + esc(c.title) + '</option>'; }).join('');
  (ls('cr.solved') || '').split(',').forEach(function (id) { if (id && CH.some(function (c) { return c.id === id; })) S.solved[id] = true; });
  var c0 = parseInt(ls('cr.chain') || '0', 10); load(c0 >= 0 && c0 < CH.length ? c0 : 0);
})();
</script>
